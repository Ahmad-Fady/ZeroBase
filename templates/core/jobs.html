<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GradJobs | Jobs</title>
    <link href="../static/main.css" rel="stylesheet" />
  </head>
  <body data-page="jobs">
    <header class="site-header">
      <div class="container nav-wrap">
        <a href="./index.html" class="brand">GradJobs</a>
        <nav class="nav-links" aria-label="Primary">
          <a href="./index.html" data-nav="home">Home</a>
          <a href="./learn.html" data-nav="learn">Learn</a>
          <a href="./internships.html" data-nav="internships">Internships</a>
          <a href="./jobs.html" data-nav="jobs">Jobs</a>
        </nav>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle theme">
          <span class="theme-toggle__icon" aria-hidden="true">🌙</span>
          <span class="theme-toggle__text">Dark</span>
        </button>
      </div>
    </header>

    <main class="container page-shell">
      <section class="page-head">
        <p class="eyebrow">Find Job</p>
        <h1>Entry-level and junior software roles</h1>
        <p>Filter by role, level, and location. View details and proceed to application flow.</p>
      </section>

      <section class="filter-grid filter-grid--three">
        <div>
          <label for="job-role-search">Role</label>
          <input id="job-role-search" type="search" placeholder="e.g. backend engineer..." />
        </div>
        <div>
          <label for="job-level-filter">Level</label>
          <select id="job-level-filter">
            <option value="">All levels</option>
            <option value="Entry">Entry</option>
            <option value="Junior">Junior</option>
            <option value="Mid">Mid</option>
          </select>
        </div>
        <div>
          <label for="job-location-search">Location</label>
          <input id="job-location-search" type="search" placeholder="e.g. Remote, Berlin..." />
        </div>
      </section>

      <section id="jobs-grid" class="listing-grid" aria-live="polite"></section>
    </main>

    <footer class="site-footer">
      <div class="container footer-wrap">
        <p>GradJobs Jobs</p>
        <p>Clean role discovery for your next full-time move.</p>
      </div>
    </footer>

    <script type="module" src="../static/main.js"></script>
  </body>
</html>
