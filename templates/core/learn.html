<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GradJobs | Learning Paths</title>
    <link href="../static/main.css" rel="stylesheet" />
  </head>
  <body data-page="learn">
    <header class="site-header">
      <div class="container nav-wrap">
        <a href="./index.html" class="brand">GradJobs</a>
        <nav class="nav-links" aria-label="Primary">
          <a href="./index.html" data-nav="home">Home</a>
          <a href="./learn.html" data-nav="learn">Learn</a>
          <a href="./internships.html" data-nav="internships">Internships</a>
          <a href="./jobs.html" data-nav="jobs">Jobs</a>
        </nav>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle theme">
          <span class="theme-toggle__icon" aria-hidden="true">🌙</span>
          <span class="theme-toggle__text">Dark</span>
        </button>
      </div>
    </header>

    <main class="container page-shell">
      <section class="page-head">
        <p class="eyebrow">Learning Path</p>
        <h1>Choose a software engineering track</h1>
        <p>Search and explore high-impact tracks to structure your study roadmap.</p>
      </section>

      <section class="filter-bar">
        <label class="sr-only" for="track-search">Search tracks</label>
        <input id="track-search" type="search" placeholder="Search track name..." />
      </section>

      <section id="track-grid" class="card-grid" aria-live="polite"></section>
    </main>

    <footer class="site-footer">
      <div class="container footer-wrap">
        <p>GradJobs Learning</p>
        <p>Discover, focus, and progress consistently.</p>
      </div>
    </footer>

    <script type="module" src="../static/main.js"></script>
  </body>
</html>
