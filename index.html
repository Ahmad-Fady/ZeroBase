<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GradJobs | Find Your First Internship</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link href="css/main.css" rel="stylesheet" />
    <link rel="icon" href="/favicon.ico">
  </head>
  <body>

    <div id="app" class="container">
      <header>
        <h1>🎓 GradJobs</h1>
        <p>The best internships for new graduates, all in one place.</p>
      </header>

      <div class="toolbar">
        <input type="text" v-model="searchQuery" placeholder="Search job titles...">

        <label for="sort">Sort by:</label>
        <select id="sort" v-model="sortKey">
          <option value="newest">Newest First</option>
          <option value="money-high">Stipend: High to Low</option>
          <option value="money-low">Stipend: Low to High</option>
          <option value="company">Company Name (A-Z)</option>
        </select>
      </div>

      <div v-if="filteredJobs.length > 0">
        <div v-for="job in filteredJobs" :key="job.id" class="job-card">
          <h2 class="job-title">{{ job.title }}</h2>
          <div class="company-name">{{ job.company }}</div>
          <div class="details">{{ job.location }} • {{ job.postedDate }}</div>

          <div class="stipend">
            Stipend: {{ job.stipend > 0 ? '$' + job.stipend : 'Unpaid' }}
          </div>

          <div :class="['badge', job.stipend > 0 ? 'badge-paid' : 'badge-unpaid']">
            {{ job.stipend > 0 ? 'Paid' : 'Unpaid' }}
          </div>
        </div>
      </div>

      <div v-else class="no-results">
        <h3>No internships found matching your search.</h3>
      </div>
    </div>

    <script>
    const { createApp, ref, computed } = Vue;

    createApp({
      setup() {
        // 1. DATA: Our "Database" of 20 sample jobs
        const jobs = ref([
          { id: 1, title: "Software Engineer Intern", company: "Google", stipend: 4500, location: "Mountain View, CA", postedDate: "2026-03-28" },
          { id: 2, title: "Frontend Developer Trainee", company: "Meta", stipend: 4200, location: "Remote", postedDate: "2026-03-30" },
          { id: 3, title: "Junior UX Designer", company: "Airbnb", stipend: 3800, location: "San Francisco, CA", postedDate: "2026-03-25" },
          { id: 4, title: "Marketing Apprentice", company: "Coca-Cola", stipend: 1500, location: "Atlanta, GA", postedDate: "2026-04-01" },
          { id: 5, title: "Data Science Intern", company: "Spotify", stipend: 3500, location: "Stockholm / Remote", postedDate: "2026-03-20" },
          { id: 6, title: "Backend Engineer Intern", company: "Amazon", stipend: 4000, location: "Seattle, WA", postedDate: "2026-03-29" },
          { id: 7, title: "Product Management Intern", company: "Microsoft", stipend: 3900, location: "Redmond, WA", postedDate: "2026-03-22" },
          { id: 8, title: "Unpaid Editorial Intern", company: "Local News Corp", stipend: 0, location: "Chicago, IL", postedDate: "2026-03-15" },
          { id: 9, title: "Cybersecurity Trainee", company: "CrowdStrike", stipend: 3200, location: "Remote", postedDate: "2026-04-02" },
          { id: 10, title: "Graphic Design Intern", company: "Adobe", stipend: 2800, location: "San Jose, CA", postedDate: "2026-03-18" },
          { id: 11, title: "QA Engineer Apprentice", company: "Netflix", stipend: 4100, location: "Los Gatos, CA", postedDate: "2026-03-27" },
          { id: 12, title: "Cloud Architecture Intern", company: "Oracle", stipend: 3100, location: "Austin, TX", postedDate: "2026-03-24" },
          { id: 13, title: "Public Relations Intern", company: "Tesla", stipend: 2000, location: "Palo Alto, CA", postedDate: "2026-03-21" },
          { id: 14, title: "Mobile App Developer", company: "Snap Inc.", stipend: 3700, location: "Santa Monica, CA", postedDate: "2026-03-31" },
          { id: 15, title: "Non-Profit Admin Intern", company: "GreenEarth", stipend: 0, location: "Remote", postedDate: "2026-03-10" },
          { id: 16, title: "AI Research Assistant", company: "OpenAI", stipend: 5000, location: "San Francisco, CA", postedDate: "2026-04-01" },
          { id: 17, title: "Financial Analyst Trainee", company: "Goldman Sachs", stipend: 3600, location: "New York, NY", postedDate: "2026-03-26" },
          { id: 18, title: "Game Dev Intern", company: "Epic Games", stipend: 3300, location: "Cary, NC", postedDate: "2026-03-23" },
          { id: 19, title: "Hardware Engineer Intern", company: "Apple", stipend: 4600, location: "Cupertino, CA", postedDate: "2026-03-29" },
          { id: 20, title: "Social Media Intern", company: "TikTok", stipend: 2200, location: "Los Angeles, CA", postedDate: "2026-03-19" }
        ]);

        // 2. STATE: What the user is doing
        const searchQuery = ref('');
        const sortKey = ref('newest');

        // 3. LOGIC: Filtering and Sorting combined
        const filteredJobs = computed(() => {
          // Start with search
          let result = jobs.value.filter(job => {
            return job.title.toLowerCase().includes(searchQuery.value.toLowerCase()) ||
              job.company.toLowerCase().includes(searchQuery.value.toLowerCase());
          });

          // Then apply sort
          if (sortKey.value === 'money-high') {
            result.sort((a, b) => b.stipend - a.stipend);
          } else if (sortKey.value === 'money-low') {
            result.sort((a, b) => a.stipend - b.stipend);
          } else if (sortKey.value === 'company') {
            result.sort((a, b) => a.company.localeCompare(b.company));
          } else if (sortKey.value === 'newest') {
            result.sort((a, b) => new Date(b.postedDate) - new Date(a.postedDate));
          }

          return result;
        });

        return {
          searchQuery,
          sortKey,
          filteredJobs
        }
      }
    }).mount('#app')
    </script>
  </body>
</html>
